# Example gateway config. Copy to config.yaml and adjust. Secrets are read
# from the environment variable named by each tier's api_key_env (see
# .env.example at the repo root).

port: 8080
router_service_url: "http://localhost:9000"
router_timeout_ms: 150
default_tier: cheap

# Order to try tiers in when the router is unavailable, or as the fallback
# chain after the router's chosen tier fails. Last entry is treated as the
# "strong" tier for cost-saved accounting.
fallback_order:
  - cheap
  - mid
  - strong

max_retries: 2

tiers:
  - name: cheap
    kind: openai
    base_url: "http://localhost:8001/v1"
    model: "Qwen/Qwen2.5-1.5B-Instruct"
    api_key_env: "" # vLLM local server, no key needed
    input_cost_per_1m: 0.0
    output_cost_per_1m: 0.0

  - name: mid
    kind: openai
    base_url: "https://api.studio.nebius.ai/v1"
    model: "meta-llama/Llama-3.3-70B-Instruct"
    api_key_env: "NEBIUS_API_KEY"
    input_cost_per_1m: 0.13
    output_cost_per_1m: 0.40

  - name: strong
    kind: anthropic
    base_url: "https://api.anthropic.com"
    model: "claude-opus-5"
    api_key_env: "ANTHROPIC_API_KEY"
    input_cost_per_1m: 5.00
    output_cost_per_1m: 25.00

# Per-API-key rate limits. Keys not listed here get the gateway default
# (60 requests/minute, burst 60).
api_keys:
  - key: "dev-local-key"
    name: "local-dev"
    requests_per_minute: 120
    burst_size: 60
