{{- if .Values.vllm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    app: {{ .Release.Name }}-vllm
spec:
  replicas: 1
  # The GPU is a singleton resource on a single-node cluster: the default
  # RollingUpdate strategy tries to schedule a second pod before killing
  # the first, which deadlocks forever on "Insufficient nvidia.com/gpu".
  # Recreate tears down the old pod first, freeing the GPU for the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-vllm
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-vllm
    spec:
      # Not the default container runtime in this cluster (only registered
      # as an optional RuntimeClass) -- without this the pod runs under
      # plain runc and never sees the GPU driver.
      runtimeClassName: {{ .Values.vllm.runtimeClassName | default "nvidia" }}
      containers:
        - name: vllm
          image: "{{ .Values.vllm.image.repository }}:{{ .Values.vllm.image.tag }}"
          args:
            - "--model"
            - "{{ .Values.vllm.model }}"
            - "--port"
            - "{{ .Values.vllm.port }}"
            {{- if .Values.vllm.extraArgs }}
            {{- toYaml .Values.vllm.extraArgs | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.vllm.disableFlashinferSampler }}
            - name: VLLM_USE_FLASHINFER_SAMPLER
              value: "0"
            {{- end }}
          ports:
            - containerPort: {{ .Values.vllm.port }}
          resources:
            {{- toYaml .Values.vllm.resources | nindent 12 }}
          # No probes here means Kubernetes reports the pod Ready as soon
          # as the process starts, well before the model is actually
          # loaded and the server is serving -- a startupProbe with a
          # generous failure budget covers model load time (weight
          # download + CUDA graph capture can take minutes), after which
          # readiness/liveness take over on vLLM's own /health endpoint.
          startupProbe:
            httpGet: { path: /health, port: {{ .Values.vllm.port }} }
            periodSeconds: 5
            failureThreshold: 60 # up to 5 minutes to finish loading
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.vllm.port }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.vllm.port }} }
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    app: {{ .Release.Name }}-vllm
spec:
  selector:
    app: {{ .Release.Name }}-vllm
  ports:
    - port: {{ .Values.vllm.port }}
      targetPort: {{ .Values.vllm.port }}
      name: http
{{- end }}
