{{- if .Values.vllm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    app: {{ .Release.Name }}-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-vllm
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-vllm
    spec:
      containers:
        - name: vllm
          image: "{{ .Values.vllm.image.repository }}:{{ .Values.vllm.image.tag }}"
          args:
            - "--model"
            - "{{ .Values.vllm.model }}"
            - "--port"
            - "{{ .Values.vllm.port }}"
          ports:
            - containerPort: {{ .Values.vllm.port }}
          resources:
            {{- toYaml .Values.vllm.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    app: {{ .Release.Name }}-vllm
spec:
  selector:
    app: {{ .Release.Name }}-vllm
  ports:
    - port: {{ .Values.vllm.port }}
      targetPort: {{ .Values.vllm.port }}
      name: http
{{- end }}
