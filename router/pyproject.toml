[project]
name = "reroute-router"
version = "0.1.0"
description = "ReRoute learned LLM router: data, training, and the online routing service"
readme = "README.md"
authors = [
    { name = "Amboyandrey", email = "andreyamboy13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
# Dataset building and LLM-judge grading against provider APIs.
data = [
    "datasets>=3.0",
    "anthropic>=0.40",
    "openai>=1.54",
    "tqdm>=4.66",
]
# Supervised (LoRA) router training + ONNX export.
train = [
    "torch>=2.5",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.1",
    "scikit-learn>=1.5",
    "onnx>=1.17",
    "onnxruntime>=1.19",
]
# Contextual bandit training + offline replay evaluation.
bandit = [
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
reroute-serve = "reroute_router.serve.main:run"

[build-system]
requires = ["uv_build>=0.8.10,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
